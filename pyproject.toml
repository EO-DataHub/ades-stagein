[project]
name = "eodhp-ades-stagein"
version = "0.0.0"
description = "ADES stagein docker image spec"
readme = "README.md"

requires-python = ">=3.14,<3.15"

license = {file = "LICENSE"}

authors = [
  {name = "Telespazio UK Ltd", email = "thomas.jellicoe@telespazio.com" }
]

maintainers = [
  {name = "Telespazio UK Ltd", email = "thomas.jellicoe@telespazio.com" }
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "pystac",
    "pystac_client",
    "boto3",
    "stac-asset",
    "urllib3>=2.5.0",
    "pyjwt",
    "requests>=2.32.4",
]

[project.urls]
homepage = "https://github.com/EO-DataHub/"
repository = "https://github.com/EO-DataHub/eodhp-ades-stagein"
changelog = "https://github.com/EO-DataHub/eodhp-ades-stagein/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-watcher",
    "pytest-xdist",
    "requests-mock",
    "ruff",
    "validate-pyproject",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
markers = [
  "integrationtest: Integration test"
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "FAST", # FastAPI
    "RUF",  # RUF-specific rules
    "SIM",  # Simplifications
    "B",    # Bugbear
    "ANN",  # Annotations
    "PLC",  # Pylint convention
    "PLE",  # Pylint errors
    "UP",   # pyupgrade
    "FURB", # refurb
    "PT",   # pytest
]
ignore = [
    "E501",   # line too long
    "SIM108", # ternary operator
    "SIM103", # return bool directly
    "B008",   # function call in default argument (incompatible with FastAPI)
    "ANN401", # dynamically typed expressions (Any) are disallowed
]
